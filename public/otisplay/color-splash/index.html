<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Color Splash — Otis Play</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238B5CF6'/></svg>">
</head>
<body>
  <div class="color-splash">
    <!-- Cadence-X In-Game Header & Dedicated Otis Play Return Navigation -->
    <div class="cx-game-nav-container">
      <header class="cx-game-header">
        <a href="https://cadence-x.com" class="cx-game-brand" id="brand-link" title="Cadence-X Home">
          <div class="cx-game-logo-box">
            <img src="../assets/cadence-x-outer-ring.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-outer-ring.png'" class="cx-game-logo-ring" alt="" />
            <img src="../assets/cadence-x-static.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-static.png'" class="cx-game-logo-center" alt="Cadence-X Logo" />
          </div>
          <span class="cx-game-brand-title">CADENCE-X</span>
        </a>

        <nav class="cx-game-nav">
          <a href="https://cadence-x.com/#services" id="nav-services" class="cx-game-nav-link">Services</a>
          <a href="https://cadence-x.com/apps.html" id="nav-apps" class="cx-game-nav-link active">Apps</a>
          <a href="https://cadence-x.com/about.html" id="nav-about" class="cx-game-nav-link">About Me</a>
        </nav>

        <button type="button" class="cx-game-mobile-btn" id="game-mobile-btn" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </header>

      <div id="game-mobile-drawer" class="cx-game-mobile-drawer">
        <a href="https://cadence-x.com/#services" id="mobile-nav-services">Services</a>
        <a href="https://cadence-x.com/apps.html" id="mobile-nav-apps" class="active">Apps</a>
        <a href="https://cadence-x.com/about.html" id="mobile-nav-about">About Me</a>
      </div>

      <!-- Dedicated Return Bar to Otis Play Game Selection -->
      <div class="cx-game-subbar">
        <a href="../index.html" class="cx-game-return-btn" id="return-to-otis" onclick="try{OtisAudio.playPop();}catch(e){}" title="Back to Otis Play Game Selection">
          <span class="cx-return-arrow">←</span>
          <span class="cx-return-icon">🎮</span>
          <span>All Games</span>
        </a>

        <nav class="cx-game-breadcrumb" aria-label="Hierarchy">
          <a href="https://cadence-x.com/apps.html" id="breadcrumb-apps" class="cx-crumb-link crumb-apps">Apps</a>
          <span class="cx-crumb-sep sep-apps">/</span>
          <a href="../index.html" class="cx-crumb-link cx-crumb-play" onclick="try{OtisAudio.playPop();}catch(e){}">Otis Play</a>
          <span class="cx-crumb-sep">/</span>
          <span class="cx-crumb-current">Color Splash</span>
        </nav>
      </div>
    </div>

    <!-- Top Bar: Title & Controls -->
    <div class="cs-top-bar">
      <div class="cs-title-box">
        <h1 class="cs-game-title">
          <span class="cs-icon-badge">🎨</span>
          <span>Color Splash</span>
        </h1>
        <p class="cs-game-subtitle">Splatter and discover joyful colors!</p>
      </div>

      <div class="cs-controls-group">
        <button type="button" class="cs-pill-btn" id="btnMode" title="Switch to Free Painting Mode" aria-label="Switch Mode">
          <span>🎨</span><span>Free Splash</span>
        </button>
        <button type="button" class="cs-pill-btn" id="btnSound" title="Toggle Sound FX" aria-label="Toggle Sound Effects">
          <span>🎵</span><span>Sound</span>
        </button>
        <button type="button" class="cs-pill-btn" id="btnVoice" title="Toggle Color Speech" aria-label="Toggle Voice Pronunciation">
          <span>🗣️</span><span>Voice</span>
        </button>
        <button type="button" class="cs-pill-btn" id="btnReset" title="Restart Round" aria-label="Restart Round">
          <span>🔄</span><span>Reset</span>
        </button>
      </div>
    </div>

    <!-- Main Play Arena -->
    <main class="cs-play-arena" id="playArena">
      <!-- Easel Card Stage -->
      <section class="cs-easel-card" id="csEaselCard" aria-label="Color Canvas Stage">
        <!-- Watercolor Splatter Canvas Layer (Background) -->
        <canvas id="csSplashCanvas" class="cs-canvas"></canvas>

        <!-- Interactive Character: Splishy the Paint Droplet -->
        <div class="cs-character-section" id="csCharacterSection" title="Tap Splishy!" aria-label="Splishy Character">
          <div class="cs-aura-glow" id="csAuraGlow"></div>
          <div class="cs-character-box" id="csCharacterBox"></div>
        </div>

        <!-- Spoken / Written Instruction Prompt -->
        <div class="cs-prompt-bubble" id="csPromptBubble" title="Tap to hear prompt again" role="button" tabindex="0">
          <span class="cs-prompt-speak-icon" aria-hidden="true">🔊</span>
          <div class="cs-prompt-text" id="csPromptText">Tap the right color button!</div>
        </div>

        <!-- Options Container: Paint Splat Buttons (Guided Mode) -->
        <div class="cs-options-container" id="csOptionsContainer" role="group" aria-label="Color Options"></div>

        <!-- Free Splash Studio Bar (Free Mode) -->
        <div class="cs-free-studio-bar" id="csFreeStudioBar">
          <div class="cs-free-palette-scroll" id="csFreePaletteScroll"></div>
          <button type="button" class="cs-clear-canvas-btn" id="btnClearCanvas" title="Wipe canvas clean">
            <span>🧹</span><span>Clear</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Bottom Stars & Status Track -->
    <div class="cs-bottom-bar">
      <div class="cs-stars-track" aria-label="Round Progress Badges">
        <div class="cs-star-badge" id="csStar1" title="Round 1: Primary Colors">1</div>
        <div class="cs-star-badge" id="csStar2" title="Round 2: Rainbow Garden">2</div>
        <div class="cs-star-badge" id="csStar3" title="Round 3: Master Painter">3</div>
      </div>
      <div class="cs-status-msg" id="csStatusMsg">
        <span class="highlight">Round 1</span> of 3 &middot; Primary Colors (1/3)
      </div>
    </div>

    <!-- Footer -->
    <footer class="game-footer">
      <span>● &copy; 2026 CADENCE-X &nbsp;·&nbsp; Otis Play</span>
    </footer>
  </div>

  <!-- Shared Otis Play Utilities -->
  <script src="../scripts/shared.js"></script>
  <!-- Modernized Game Engine -->
  <script src="game.js"></script>

  <!-- Local link updater & Mobile drawer toggle -->
  <script>
    (function() {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocal) {
        const update = (id, target) => { const el = document.getElementById(id); if (el) el.setAttribute('href', target); };
        update('brand-link', '/');
        update('nav-services', '/#services');
        update('nav-apps', '/apps.html');
        update('nav-about', '/about.html');
        update('breadcrumb-apps', '/apps.html');
        update('mobile-nav-services', '/#services');
        update('mobile-nav-apps', '/apps.html');
        update('mobile-nav-about', '/about.html');
      }
      const mb = document.getElementById('game-mobile-btn');
      const md = document.getElementById('game-mobile-drawer');
      if (mb && md) mb.addEventListener('click', () => md.classList.toggle('open'));
    })();
  </script>
</body>
</html>
