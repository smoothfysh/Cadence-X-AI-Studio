<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Color Splash — Otis Play</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23FFB5C2'/></svg>">
  <style>
    .color-splash { width: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); position: relative; overflow: hidden; padding-top: var(--header-h); }

    .cs-back-link {
      font-size: 1.3rem; text-decoration: none; color: var(--text);
      padding: 8px 18px; border-radius: 12px;
      background: rgba(255,255,255,0.9); box-shadow: 0 2px 8px var(--shadow);
      font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
      transition: var(--transition);
    }
    .cs-back-link:active { transform: scale(0.92); }

    .cs-title-group { text-align: center; padding: 20px 12px 0; }
    .cs-title { font-size: clamp(2.2rem, 7vw, 3.5rem) !important; font-weight: 800; color: var(--violet); margin-bottom: 2px; }

    /* The character */
    .cs-character {
      width: 160px; height: 180px; margin-bottom: 24px;
      position: relative; animation: float 2.5s ease-in-out infinite;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .cs-character.happy { animation: bounce 0.5s ease; }

    .cs-prompt {
      font-size: clamp(1rem, 3vw, 1.3rem); font-weight: 600;
      color: var(--text); opacity: 0.65; margin: 0 0 20px;
      min-height: 1.8rem; animation: fadeIn 0.4s ease;
    }

    .cs-colors {
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
      padding: 0 16px;
      max-width: 100%;
    }
    .cs-color-btn {
      width: 100px; height: 100px; border-radius: 50%;
      border: 5px solid rgba(255,255,255,0.7); cursor: pointer;
      transition: var(--transition); touch-action: manipulation;
      box-shadow: 0 6px 16px var(--shadow);
      flex-shrink: 0;
    }
    .cs-color-btn:active { transform: scale(0.9); }
    .cs-color-btn.wrong { animation: wobble 0.4s ease; }

    .cs-progress {
      position: absolute; bottom: 28px; left: 0; right: 0;
      text-align: center; font-size: 0.85rem; opacity: 0.5;
    }

    @media (max-width: 768px) {
      .cs-character { width: 140px; height: 158px; margin-bottom: 16px; }
      .cs-colors { gap: 12px; }
      .cs-color-btn { width: 90px; height: 90px; }
    }

    @media (max-width: 480px) {
      .cs-character { width: 120px; height: 135px; }
      .cs-color-btn { width: 80px; height: 80px; }
      .cs-prompt { font-size: clamp(1.2rem, 5vw, 1.8rem); }
    }
  </style>
</head>
<body>
  <div class="color-splash">
    <!-- Cadence-X In-Game Header & Dedicated Otis Play Return Navigation -->
    <div class="cx-game-nav-container">
      <header class="cx-game-header">
        <a href="https://cadence-x.com" class="cx-game-brand" id="brand-link" title="Cadence-X Home">
          <div class="cx-game-logo-box">
            <img src="../assets/cadence-x-outer-ring.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-outer-ring.png'" class="cx-game-logo-ring" alt="" />
            <img src="../assets/cadence-x-static.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-static.png'" class="cx-game-logo-center" alt="Cadence-X Logo" />
          </div>
          <span class="cx-game-brand-title">CADENCE-X</span>
        </a>

        <nav class="cx-game-nav">
          <a href="https://cadence-x.com/#services" id="nav-services" class="cx-game-nav-link">Services</a>
          <a href="https://cadence-x.com/apps.html" id="nav-apps" class="cx-game-nav-link active">Apps</a>
          <a href="https://cadence-x.com/about.html" id="nav-about" class="cx-game-nav-link">About Me</a>
        </nav>

        <button type="button" class="cx-game-mobile-btn" id="game-mobile-btn" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </header>

      <div id="game-mobile-drawer" class="cx-game-mobile-drawer">
        <a href="https://cadence-x.com/#services" id="mobile-nav-services">Services</a>
        <a href="https://cadence-x.com/apps.html" id="mobile-nav-apps" class="active">Apps</a>
        <a href="https://cadence-x.com/about.html" id="mobile-nav-about">About Me</a>
      </div>

      <!-- Dedicated Return Bar to Otis Play Game Selection -->
      <div class="cx-game-subbar">
        <a href="../index.html" class="cx-game-return-btn" id="return-to-otis" onclick="try{OtisAudio.playPop();}catch(e){}" title="Back to Otis Play Game Selection">
          <span class="cx-return-arrow">←</span>
          <span class="cx-return-icon">🎮</span>
          <span>All Games</span>
        </a>

        <nav class="cx-game-breadcrumb" aria-label="Hierarchy">
          <a href="https://cadence-x.com/apps.html" id="breadcrumb-apps" class="cx-crumb-link crumb-apps">Apps</a>
          <span class="cx-crumb-sep sep-apps">/</span>
          <a href="../index.html" class="cx-crumb-link cx-crumb-play" onclick="try{OtisAudio.playPop();}catch(e){}">Otis Play</a>
          <span class="cx-crumb-sep">/</span>
          <span class="cx-crumb-current">Color Splash</span>
        </nav>
      </div>
    </div>

    <div class="cs-title-group">
      <div class="cs-title">Color Splash</div>
      <p class="cs-prompt" id="csPrompt">Tap the right color button!</p>
    </div>

    <!-- Character SVG rendered by JS -->
    <div class="cs-character" id="csCharacter"></div>
    <div class="cs-colors" id="csColors"></div>
    <div class="cs-progress" id="csProgress">1 / 6</div>
    <div class="game-footer"><span>● &copy; 2026 CADENCE-X &nbsp;·&nbsp; Otis Play</span></div>
  </div>

  <script src="../scripts/shared.js"></script>
  <script>
    (function() {
      const COLORS = [
        { name: 'Red', hex: '#E53935' },
        { name: 'Blue', hex: '#1E88E5' },
        { name: 'Yellow', hex: '#FDD835' },
        { name: 'Green', hex: '#43A047' },
        { name: 'Orange', hex: '#FB8C00' },
        { name: 'Purple', hex: '#8E24AA' },
        { name: 'Pink', hex: '#EC407A' },
        { name: 'Brown', hex: '#6D4C41' },
        { name: 'Black', hex: '#212121' },
        { name: 'White', hex: '#FFFFFF' },
        { name: 'Grey', hex: '#9E9E9E' }
      ];

      let currentRound = 0;
      let currentColor = null;
      let canTap = true;

      const charEl = document.getElementById('csCharacter');
      const promptEl = document.getElementById('csPrompt');
      const colorsEl = document.getElementById('csColors');
      const progressEl = document.getElementById('csProgress');

      function buildCharacter(color) {
        const r = parseInt(color.hex.slice(1,3), 16);
        const g = parseInt(color.hex.slice(3,5), 16);
        const b = parseInt(color.hex.slice(5,7), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const stroke = luminance > 0.6 ? '#2D3436' : 'white';
        return `<svg viewBox="0 0 100 120" width="100%" height="100%">
          <polygon points="50,5 95,110 5,110" fill="${color.hex}" stroke="${stroke}" stroke-width="2"/>
          <circle cx="50" cy="25" r="18" fill="${color.hex}" stroke="${stroke}" stroke-width="3"/>
          <circle cx="42" cy="22" r="3" fill="white"/>
          <circle cx="58" cy="22" r="3" fill="white"/>
          <circle cx="42" cy="22" r="1.5" fill="#2D3436"/>
          <circle cx="58" cy="22" r="1.5" fill="#2D3436"/>
          <path d="M40 32 Q50 40 60 32" stroke="${stroke}" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>`;
      }

      function loadRound() {
        if (currentRound >= COLORS.length) {
          createCelebration(document.body, 'You know all the colors!', '🎨', () => {
            currentRound = 0; loadRound();
          }, () => { window.location.href = '../index.html'; });
          progressEl.textContent = 'Amazing! 🌈';
          return;
        }

        currentColor = COLORS[currentRound];
        canTap = true;
        charEl.innerHTML = buildCharacter(currentColor);
        charEl.classList.remove('happy');
        promptEl.textContent = `Tap the ${currentColor.name} button!`;
        progressEl.textContent = `${currentRound + 1} / ${COLORS.length}`;

        // Build color buttons — 3 options (1 correct + 2 random others)
        const others = shuffleArray(COLORS.filter(c => c.name !== currentColor.name));
        const options = shuffleArray([currentColor, others[0], others[1]]);

        colorsEl.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'cs-color-btn';
          btn.style.background = opt.hex;
          btn.dataset.name = opt.name;
          btn.addEventListener('click', () => handleTap(btn, opt));
          colorsEl.appendChild(btn);
        });

        OtisSpeech.speak(`Tap the ${currentColor.name} button`);
      }

      function handleTap(btn, opt) {
        if (!canTap) return;
        if (opt.name === currentColor.name) {
          // Correct!
          canTap = false;
          OtisAudio.playChime();
          charEl.classList.add('happy');
          const rect = btn.getBoundingClientRect();
          OtisParticles.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, currentColor.hex, 20);
          currentRound++;
          setTimeout(loadRound, 1000);
        } else {
          // Wrong
          btn.classList.add('wrong');
          OtisAudio.playWobble();
          setTimeout(() => btn.classList.remove('wrong'), 400);
        }
      }

      loadRound();
    })();
  </script>
  <script>
    (function() {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocal) {
        const update = (id, target) => { const el = document.getElementById(id); if (el) el.setAttribute('href', target); };
        update('brand-link', '/');
        update('nav-services', '/#services');
        update('nav-apps', '/apps.html');
        update('nav-about', '/about.html');
        update('breadcrumb-apps', '/apps.html');
        update('mobile-nav-services', '/#services');
        update('mobile-nav-apps', '/apps.html');
        update('mobile-nav-about', '/about.html');
      }
      const mb = document.getElementById('game-mobile-btn');
      const md = document.getElementById('game-mobile-drawer');
      if (mb && md) mb.addEventListener('click', () => md.classList.toggle('open'));
    })();
  </script>
</body>
</html>
