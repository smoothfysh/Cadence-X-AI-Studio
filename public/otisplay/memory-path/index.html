<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Memory Path — Otis Play by Cadence-X</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 30,16 16,30 2,16' fill='%23F59E0B'/></svg>">
</head>
<body>
  <div class="memory-path-game" id="memoryPathGame">
    <!-- Ambient Floating Fireflies & Stardust -->
    <div class="mp-ambient-fx" aria-hidden="true">
      <div class="mp-firefly"></div>
      <div class="mp-firefly"></div>
      <div class="mp-firefly"></div>
      <div class="mp-firefly"></div>
      <div class="mp-firefly"></div>
      <div class="mp-firefly"></div>
    </div>

    <!-- Cadence-X In-Game Header & Dedicated Otis Play Return Navigation -->
    <div class="cx-game-nav-container">
      <header class="cx-game-header">
        <a href="https://cadence-x.com" class="cx-game-brand" id="brand-link" title="Cadence-X Home">
          <div class="cx-game-logo-box">
            <img src="../assets/cadence-x-outer-ring.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-outer-ring.png'" class="cx-game-logo-ring" alt="" />
            <img src="../assets/cadence-x-static.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-static.png'" class="cx-game-logo-center" alt="Cadence-X Logo" />
          </div>
          <span class="cx-game-brand-title">CADENCE-X</span>
        </a>

        <nav class="cx-game-nav">
          <a href="https://cadence-x.com/#services" id="nav-services" class="cx-game-nav-link">Services</a>
          <a href="https://cadence-x.com/apps.html" id="nav-apps" class="cx-game-nav-link active">Apps</a>
          <a href="https://cadence-x.com/about.html" id="nav-about" class="cx-game-nav-link">About Me</a>
        </nav>

        <button type="button" class="cx-game-mobile-btn" id="game-mobile-btn" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </header>

      <div id="game-mobile-drawer" class="cx-game-mobile-drawer">
        <a href="https://cadence-x.com/#services" id="mobile-nav-services">Services</a>
        <a href="https://cadence-x.com/apps.html" id="mobile-nav-apps" class="active">Apps</a>
        <a href="https://cadence-x.com/about.html" id="mobile-nav-about">About Me</a>
      </div>

      <!-- Dedicated Return Subbar to Otis Play Game Selection -->
      <div class="cx-game-subbar">
        <a href="../index.html" class="cx-game-return-btn" id="return-to-otis" onclick="try{OtisAudio.playPop();}catch(e){}" title="Back to Otis Play Game Selection">
          <span class="cx-return-arrow">←</span>
          <span class="cx-return-icon">🎮</span>
          <span>All Games</span>
        </a>

        <nav class="cx-game-breadcrumb" aria-label="Hierarchy">
          <a href="https://cadence-x.com/apps.html" id="breadcrumb-apps" class="cx-crumb-link crumb-apps">Apps</a>
          <span class="cx-crumb-sep sep-apps">/</span>
          <a href="../index.html" class="cx-crumb-link cx-crumb-play" onclick="try{OtisAudio.playPop();}catch(e){}">Otis Play</a>
          <span class="cx-crumb-sep">/</span>
          <span class="cx-crumb-current">Memory Path</span>
        </nav>
      </div>
    </div>

    <!-- Fun & Compact Top Bar: Game Title & Chunky Toy Controls -->
    <div class="mp-top-bar">
      <div class="mp-title-box">
        <span class="mp-title-badge" aria-hidden="true">💎</span>
        <div>
          <h1 class="mp-game-title">Memory Path</h1>
          <p class="mp-game-subtitle">Singing Crystals &amp; Melody Magic</p>
        </div>
      </div>

      <div class="mp-controls-group">
        <button type="button" class="mp-toy-btn active" id="btnMode" title="Toggle Play Mode" aria-label="Toggle Play Mode">
          <span>🎯 Quest</span>
        </button>
        <button type="button" class="mp-toy-btn" id="btnPace" title="Toggle Pacing Speed" aria-label="Toggle Demonstration Speed">
          <span>🐰 Normal</span>
        </button>
        <button type="button" class="mp-toy-btn" id="btnSound" title="Toggle Sound FX" aria-label="Toggle Sound Effects">
          <span>🎵</span>
        </button>
        <button type="button" class="mp-toy-btn" id="btnVoice" title="Toggle Spoken Speech" aria-label="Toggle Spoken Narration">
          <span>🗣️</span>
        </button>
        <button type="button" class="mp-toy-btn" id="btnReset" title="Restart Current Round" aria-label="Restart Round">
          <span>🔄</span>
        </button>
      </div>
    </div>

    <!-- Mission Banner: Otis Mascot + Spoken Prompt + Step Pods -->
    <div class="mp-mission-banner" role="region" aria-label="Current Mission">
      <div class="mp-mascot-row">
        <!-- Otis the Star Owl Guide -->
        <div class="mp-mascot-wrapper" id="mpMascot" title="Tap Otis the Owl!" role="button" tabindex="0" aria-label="Otis the Star Owl Guide">
          <svg viewBox="0 0 100 100" class="mp-mascot-svg">
            <defs>
              <linearGradient id="mp-owl-body" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#A78BFA"/>
                <stop offset="60%" stop-color="#7C3AED"/>
                <stop offset="100%" stop-color="#5B21B6"/>
              </linearGradient>
              <linearGradient id="mp-owl-belly" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FFFBEB"/>
                <stop offset="100%" stop-color="#FEF08A"/>
              </linearGradient>
            </defs>
            <!-- Ear Tufts -->
            <polygon points="25,28 15,10 38,20" fill="#6D28D9"/>
            <polygon points="75,28 85,10 62,20" fill="#6D28D9"/>
            <!-- Body -->
            <ellipse cx="50" cy="56" rx="34" ry="38" fill="url(#mp-owl-body)"/>
            <!-- Wings -->
            <ellipse cx="18" cy="60" rx="9" ry="22" fill="#5B21B6" transform="rotate(15 18 60)"/>
            <ellipse cx="82" cy="60" rx="9" ry="22" fill="#5B21B6" transform="rotate(-15 82 60)"/>
            <!-- Tummy -->
            <ellipse cx="50" cy="64" rx="22" ry="24" fill="url(#mp-owl-belly)"/>
            <!-- Star Medallion -->
            <circle cx="50" cy="46" r="6" fill="#F59E0B"/>
            <polygon points="50,42 52,45 55,46 52,47 50,50 48,47 45,46 48,45" fill="#FFFFFF"/>
            <!-- Big Eyes Outer -->
            <circle cx="37" cy="36" r="14" fill="#FFFFFF"/>
            <circle cx="63" cy="36" r="14" fill="#FFFFFF"/>
            <!-- Eye Iris & Highlights -->
            <circle cx="37" cy="36" r="9" fill="#1E1B4B"/>
            <circle cx="63" cy="36" r="9" fill="#1E1B4B"/>
            <circle cx="34" cy="33" r="3" fill="#FFFFFF"/>
            <circle cx="60" cy="33" r="3" fill="#FFFFFF"/>
            <circle cx="39" cy="38" r="1.5" fill="#FFFFFF"/>
            <circle cx="65" cy="38" r="1.5" fill="#FFFFFF"/>
            <!-- Eyelids (for blinking animation) -->
            <g class="mp-eye-lid">
              <ellipse cx="37" cy="28" rx="14" ry="6" fill="#7C3AED" opacity="0.9"/>
              <ellipse cx="63" cy="28" rx="14" ry="6" fill="#7C3AED" opacity="0.9"/>
            </g>
            <!-- Beak -->
            <polygon points="50,38 45,46 55,46" fill="#F59E0B"/>
            <!-- Little Feet -->
            <ellipse cx="42" cy="92" rx="6" ry="4" fill="#F59E0B"/>
            <ellipse cx="58" cy="92" rx="6" ry="4" fill="#F59E0B"/>
          </svg>
        </div>

        <!-- Spoken Prompt Bubble -->
        <div class="mp-prompt-bubble" id="mpPromptBubble" title="Tap to hear prompt" role="button" tabindex="0">
          <span class="mp-prompt-icon" id="mpPromptIcon" aria-hidden="true">💬</span>
          <div class="mp-prompt-text" id="mpPromptText">▶ Press Start to begin the song!</div>
        </div>
      </div>

      <!-- Montessori Sequence Step Pods (Real-Time Visual Progress) -->
      <div class="mp-step-pods" id="mpStepPods" title="Melody Step Stones" role="status" aria-label="Melody Sequence Step Pods"></div>
    </div>

    <!-- Main Game Play Arena: The Glade Platform & Singing Gems -->
    <main class="mp-stage-arena" id="playArena">
      <div class="mp-glade-platform">
        <div class="mp-platform-aura" aria-hidden="true"></div>
        <div class="mp-gems-container" id="mpGemsContainer" role="group" aria-label="Crystal Gemstones"></div>
      </div>

      <!-- Action Controls: Start & Watch Again Buttons -->
      <div class="mp-action-area">
        <button type="button" class="mp-start-btn" id="mpStartBtn">
          <span>▶ Start Song!</span>
        </button>
        <button type="button" class="mp-replay-btn" id="mpReplayBtn">
          <span>🔁 Watch Again</span>
        </button>
      </div>
    </main>

    <!-- Bottom Milestone Bar: Star Badges & Level Progress -->
    <div class="mp-bottom-bar">
      <div class="mp-stars-track" id="mpStarsTrack" aria-label="Level Milestones"></div>
      <div class="mp-status-msg" id="mpStatusMsg">Level 1 of 6 · Sparkle Steps</div>
    </div>

    <!-- Cadence-X Game Footer -->
    <div class="game-footer">
      <span>● &copy; 2026 CADENCE-X &nbsp;·&nbsp; Otis Play</span>
    </div>
  </div>

  <!-- Shared Otis Play Utilities & Modern Game Engine -->
  <script src="../scripts/shared.js"></script>
  <script src="game.js"></script>

  <!-- Localhost Routing & Mobile Drawer Navigation Support -->
  <script>
    (function() {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocal) {
        const update = (id, target) => { const el = document.getElementById(id); if (el) el.setAttribute('href', target); };
        update('brand-link', '/');
        update('nav-services', '/#services');
        update('nav-apps', '/apps.html');
        update('nav-about', '/about.html');
        update('breadcrumb-apps', '/apps.html');
        update('mobile-nav-services', '/#services');
        update('mobile-nav-apps', '/apps.html');
        update('mobile-nav-about', '/about.html');
      }
      const mb = document.getElementById('game-mobile-btn');
      const md = document.getElementById('game-mobile-drawer');
      if (mb && md) {
        mb.addEventListener('click', () => md.classList.toggle('open'));
      }
    })();
  </script>
</body>
</html>
