<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ABC Animal Stickers — Otis Play</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="styles/game.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23F59E0B'/><text x='16' y='22' font-size='16' text-anchor='middle'>🐊</text></svg>">
</head>
<body>
  <div class="ab-wrapper" id="app">
    <!-- Background Floating Cloud Accents -->
    <div class="ab-bg-accents" aria-hidden="true">
      <div class="ab-bg-cloud ab-cloud-1"></div>
      <div class="ab-bg-cloud ab-cloud-2"></div>
      <div class="ab-bg-cloud ab-cloud-3"></div>
    </div>

    <!-- Cadence-X In-Game Header & Dedicated Otis Play Return Navigation -->
    <div class="cx-game-nav-container">
      <header class="cx-game-header">
        <a href="https://cadence-x.com" class="cx-game-brand" id="brand-link" title="Cadence-X Home">
          <div class="cx-game-logo-box">
            <img src="../assets/cadence-x-outer-ring.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-outer-ring.png'" class="cx-game-logo-ring" alt="" />
            <img src="../assets/cadence-x-static.png" onerror="this.src='https://www.cadence-x.com/uploads/cadence-x-static.png'" class="cx-game-logo-center" alt="Cadence-X Logo" />
          </div>
          <span class="cx-game-brand-title">CADENCE-X</span>
        </a>

        <nav class="cx-game-nav">
          <a href="https://cadence-x.com/#services" id="nav-services" class="cx-game-nav-link">Services</a>
          <a href="https://cadence-x.com/apps.html" id="nav-apps" class="cx-game-nav-link active">Apps</a>
          <a href="https://cadence-x.com/about.html" id="nav-about" class="cx-game-nav-link">About Me</a>
        </nav>

        <button type="button" class="cx-game-mobile-btn" id="game-mobile-btn" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </header>

      <div id="game-mobile-drawer" class="cx-game-mobile-drawer">
        <a href="https://cadence-x.com/#services" id="mobile-nav-services">Services</a>
        <a href="https://cadence-x.com/apps.html" id="mobile-nav-apps" class="active">Apps</a>
        <a href="https://cadence-x.com/about.html" id="mobile-nav-about">About Me</a>
      </div>

      <!-- Dedicated Return Bar to Otis Play Game Selection -->
      <div class="cx-game-subbar">
        <a href="../index.html" class="cx-game-return-btn" id="return-to-otis" onclick="try{AlphaAudio.playPop();}catch(e){}" title="Back to Otis Play Game Selection">
          <span class="cx-return-arrow">←</span>
          <span class="cx-return-icon">🎮</span>
          <span>All Games</span>
        </a>

        <nav class="cx-game-breadcrumb" aria-label="Hierarchy">
          <a href="https://cadence-x.com/apps.html" id="breadcrumb-apps" class="cx-crumb-link crumb-apps">Apps</a>
          <span class="cx-crumb-sep sep-apps">/</span>
          <a href="../index.html" class="cx-crumb-link cx-crumb-play" onclick="try{AlphaAudio.playPop();}catch(e){}">Otis Play</a>
          <span class="cx-crumb-sep">/</span>
          <span class="cx-crumb-current">ABC Animal Stickers</span>
        </nav>
      </div>
    </div>

    <!-- Top Bar: Game Title & Chunky Toy Controls -->
    <div class="ab-top-bar">
      <div class="ab-title-box">
        <span class="ab-icon-badge" aria-hidden="true">🐊📖</span>
        <div>
          <h1 class="ab-game-title">ABC Animal Stickers</h1>
          <p class="ab-game-subtitle">Explore letters with 120 lovable animal friends!</p>
        </div>
      </div>

      <div class="ab-controls-group">
        <button type="button" class="ab-toy-btn ab-btn-mode" id="btnModeAlbum" title="Sticker Album" aria-label="Open Sticker Album">
          <span>📖</span><span class="btn-text">Album</span>
        </button>
        <button type="button" class="ab-toy-btn ab-btn-mode active" id="btnModeQuest" title="Letter Quest Game" aria-label="Play Letter Quest">
          <span>🎯</span><span class="btn-text">Quest</span>
        </button>
        <button type="button" class="ab-toy-btn" id="btnToggleCase" title="Toggle Letter Case (Aa / A / a)" aria-label="Toggle Letter Case">
          <span class="btn-label">🔤 Aa</span>
        </button>
        <button type="button" class="ab-toy-btn" id="btnToggleSound" title="Toggle Sound FX" aria-label="Toggle Sound Effects">
          <span>🎵</span><span class="btn-text">Sound</span>
        </button>
        <button type="button" class="ab-toy-btn" id="btnToggleVoice" title="Toggle Voice Narration" aria-label="Toggle Voice Speech">
          <span>🗣️</span><span class="btn-text">Voice</span>
        </button>
        <button type="button" class="ab-toy-btn" id="btnShuffle" title="Shuffle Animals or New Round" aria-label="Shuffle Animals">
          <span>🔀</span><span class="btn-text">Shuffle</span>
        </button>
      </div>
    </div>

    <!-- Main View Stage -->
    <div class="ab-views-stage">
      <!-- VIEW 1: STICKER ALBUM -->
      <section class="ab-view-screen" id="viewAlbum" aria-label="Sticker Album">
        <!-- Alphabet Carousel Ribbon (A to Z) -->
        <div class="ab-ribbon-container">
          <nav class="ab-ribbon" id="abRibbon" aria-label="Alphabet Letters A to Z"></nav>
        </div>

        <!-- Album Subheader (Spotlight vs Grid toggle) -->
        <div class="ab-album-subbar">
          <div class="ab-subview-toggle">
            <button type="button" class="ab-subview-btn active" id="btnAlbumSpotlight">🏷️ Spotlight</button>
            <button type="button" class="ab-subview-btn" id="btnAlbumGrid">🔲 All Letters Grid</button>
          </div>
          <div class="ab-collection-counter" id="abCollectionCounter">
            <span>Explore all 26 letters! ⭐</span>
          </div>
        </div>

        <!-- Spotlight View -->
        <div class="ab-spotlight-arena" id="abSpotlightView"></div>

        <!-- 26 Letters Grid View -->
        <div class="ab-grid-arena hidden" id="abGridView"></div>
      </section>

      <!-- VIEW 2: LETTER QUEST (Match Adventure) -->
      <section class="ab-view-screen active" id="viewQuest" aria-label="Letter Quest Game">
        <div class="ab-quest-container">
          <div class="ab-quest-card">
            <!-- Round & Star Progress Bar -->
            <div class="ab-quest-header-bar">
              <span class="ab-quest-round-badge" id="questRoundBadge">Round 1 of 5</span>
              <div class="ab-quest-stars-track" id="questStarsTrack" aria-label="Round Stars"></div>
            </div>

            <!-- Target Letter Banner -->
            <div class="ab-quest-prompt-box">
              <div class="ab-quest-prompt-row">
                <div class="ab-quest-letter-bubble" id="questPromptLetter">
                  <span class="ab-quest-target-char">A</span>
                </div>
                <h2 class="ab-quest-prompt-text" id="questPromptText">
                  Which animal starts with letter A?
                </h2>
              </div>
            </div>

            <!-- Choice Cards Grid (1 Correct + 2 Distractors) -->
            <div class="ab-quest-choices-grid" id="questChoicesGrid"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Cadence-X Game Footer -->
    <footer class="game-footer">
      <span>● &copy; 2026 CADENCE-X &nbsp;·&nbsp; Otis Play</span>
    </footer>
  </div>

  <!-- Shared & Modular Game Scripts -->
  <script src="../scripts/shared.js"></script>
  <script src="js/facts.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/book.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function() {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocal) {
        const update = (id, target) => { const el = document.getElementById(id); if (el) el.setAttribute('href', target); };
        update('brand-link', '/');
        update('nav-services', '/#services');
        update('nav-apps', '/apps.html');
        update('nav-about', '/about.html');
        update('breadcrumb-apps', '/apps.html');
        update('mobile-nav-services', '/#services');
        update('mobile-nav-apps', '/apps.html');
        update('mobile-nav-about', '/about.html');
      }
      const mb = document.getElementById('game-mobile-btn');
      const md = document.getElementById('game-mobile-drawer');
      if (mb && md) mb.addEventListener('click', () => md.classList.toggle('open'));
    })();
  </script>
</body>
</html>
